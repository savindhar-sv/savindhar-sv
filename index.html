<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#0f6b4f">
  <title>BinGo — Waste, sorted.</title>
  <style>
    :root {
      color-scheme: light;
      font-family: system-ui, sans-serif;
      color: #17332c;
      background: #f5f8f5;
    }

    body {
      display: grid;
      min-height: 100vh;
      margin: 0;
      place-items: center;
    }

    main {
      max-width: 32rem;
      padding: 2rem;
      text-align: center;
    }

    a {
      display: inline-block;
      margin-top: 1rem;
      padding: 0.8rem 1.2rem;
      border-radius: 0.6rem;
      background: #0f6b4f;
      color: #fff;
      font-weight: 700;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <main>
    <h1>Opening BinGo…</h1>
    <p>If you are not redirected, use the button below to open the app.</p>
    <a id="app-link" href="/savindhar-sv/BinGo/">Open BinGo</a>
  </main>
  <script>
    const siteRoot = new URL(window.location.href);
    if (!siteRoot.pathname.endsWith("/")) {
      siteRoot.pathname += "/";
    }
    const appUrl = new URL("BinGo/", siteRoot);
    document.querySelector("#app-link").href = appUrl.href;
    window.location.replace(appUrl.href);
  </script>
</body>
</html>
